<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Job Application Form</h1>

        <form action="/submit" method="post">
            <label for="fullname">Full Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your Full-name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your Email" required>

            <label for="position">Position Applied For:</label>
            <select id="position" name="position" required>
                <option value="">Select a position</option>
                <option value="developer">Developer</option>
                <option value="designer">Designer</option>
                <option value="manager">Manager</option>

            </select>

            <fieldset>

                <legend>Availability:</legend>
                <label><input type="radio" name="availability" value="Full-Time">Full-Time</label>
                <label><input type="radio" name="availability" value="Part-Time">Part-Time</label>

            </fieldset>


                <label>Why do you want this job?</label>
                <textarea name="reason" rows="4" cols="50" required placeholder="Why do you want this job?"></textarea>

            <button type="submit">Submit Application</button>
        </form>
    </div>
</body>
</html>
